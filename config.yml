---
configure_dotfiles: true
configure_terminal: false
configure_osx: false
configure_dock: false

dotfiles_repo: https://github.com/ujwalkomarla/dotfiles.git
dotfiles_files:
  - .zshrc
  - .zprofile
  - .gitignore
  - .vimrc

homebrew_taps: []

homebrew_installed_packages:
  - bash-completion
  - git
  - gh
  - go
  - gpg
  - httpie
  - iperf
  - sqlite
  - nmap
  - node
  - ssh-copy-id
  - openssl
  - pv
  - wget
  - zsh-history-substring-search
  # Inference
  - llama.cpp
  - uv
  - hf
  # Ops
  - btop
  - tmux
  - restic
  - jq
  - yq
  - mosh

homebrew_cask_apps:
  - duckduckgo
  - firefox
  - iterm2
  - lm-studio
  - obsidian
  - orbstack
  - rectangle
  - visual-studio-code

# Studio-specific settings and services (tasks/studio.yml).
post_provision_tasks:
  - "{{ playbook_dir }}/tasks/studio.yml"

studio_user: "{{ ansible_user | default(lookup('env', 'USER')) }}"
studio_home: "/Users/{{ studio_user }}"
studio_llm_dir: "{{ studio_home }}/LLM"
studio_log_dir: /opt/homebrew/var/log
# 112GB of 128GB, leaving 16GB for macOS.
studio_wired_limit_mb: 114688

studio_pmset:
  sleep: 0
  disksleep: 0
  autorestart: 1
  womp: 1
  powernap: 0

studio_ports:
  router: 9931
  mlx_audio: 8001
  litellm: 4000

# Models served by the `llama serve` router. Options are `llama serve`
# flags without the leading dashes.
studio_qwen_dir: "{{ studio_llm_dir }}/models/ggml-org/Qwen3.8-27B-GGUF"
studio_gemma_dir: "{{ studio_llm_dir }}/models/lmstudio-community/gemma-4-31B-it-GGUF"
studio_router_models:
  - name: "ggml-org/Qwen3.8-27B-GGUF:Q4_K_M"
    model: "{{ studio_qwen_dir }}/Qwen3.8-27B-Q4_K_M.gguf"
    options:
      ctx-size: 131072
      mmproj: "{{ studio_qwen_dir }}/mmproj-Qwen3.8-27B-Q8_0.gguf"
      spec-type: draft-dflash
      spec-draft-model: "{{ studio_qwen_dir }}/dflash-Qwen3.8-27B-Q4_0.gguf"
      spec-draft-n-max: 7
      ubatch-size: 2048
      tags: chat
  - name: "lmstudio-community/gemma-4-31B-it-GGUF:Q6_K"
    model: "{{ studio_gemma_dir }}/gemma-4-31B-it-Q6_K.gguf"
    options:
      ctx-size: 131072
      mmproj: "{{ studio_gemma_dir }}/mmproj-gemma-4-31B-it-BF16.gguf"
      tags: chat
  - name: "ggml-org/gemma-4-E4B-it-GGUF:Q8_0"
    model: "{{ studio_llm_dir }}/models/ggml-org/gemma-4-E4B-it-GGUF/gemma-4-E4B-it-Q8_0.gguf"
    options:
      ctx-size: 16384
      mmproj: "{{ studio_llm_dir }}/models/ggml-org/gemma-4-E4B-it-GGUF/mmproj-gemma-4-E4B-it-Q8_0.gguf"
      tags: voice
