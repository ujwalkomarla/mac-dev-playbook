---

configure_dotfiles: false
configure_terminal: false
configure_osx: false

dotfiles_repo: https://github.com/ujwalkomarla/dotfiles.git
dotfiles_repo_local_destination: ~/Downloads/gitRepos/dotfiles

homebrew_installed_packages:
  # - ansible # Installed via Pip.
  - bash-completion
  - gettext # https://www.labri.fr/perso/fleury/posts/programming/a-quick-gettext-tutorial.html
  - git
  - gpg # https://www.linode.com/docs/security/encryption/gpg-keys-to-send-encrypted-messages/
  - httpie # https://httpie.org/
  - node
  - openssl
  - ssh-copy-id
  - wget
  - zsh-history-substring-search
  # Custom Items
  - act
  - gnupg
  - hopenpgp-tools
  - pass
  - pass-otp
  - pinentry-mac
  - rclone # https://rclone.org - rsync for cloud storage
  - signal
  - syncthing
  - thefuck # https://github.com/nvbn/thefuck - Magnificent app which corrects your previous console command.
  - tldr # https://tldr.sh - Simplified and community-driven man pages
  - tmux
  - tree
  # - virtualbox # Doesn't support ARM platform
  # - wireguard-tools
  - ykman
  - yubikey-personalization
  - zbar # QR-code scanner for pass otp

